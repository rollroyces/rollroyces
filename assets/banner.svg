<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="Royce — bioinformatics, mRNA, formal methods, cfDNA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <!-- bio-warm gradient backdrop -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1B1226"/>
      <stop offset="55%" stop-color="#2A1A2E"/>
      <stop offset="100%" stop-color="#3B1A2A"/>
    </linearGradient>
    <linearGradient id="helixA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#FFA94D"/>
    </linearGradient>
    <linearGradient id="helixB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFA94D"/>
      <stop offset="100%" stop-color="#FFD43B"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4DD9CC"/>
      <stop offset="100%" stop-color="#74C0FC"/>
    </linearGradient>
    <linearGradient id="proofGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD43B"/>
      <stop offset="100%" stop-color="#FFA94D"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  <!-- subtle dot grid -->
  <g fill="#FFFFFF" fill-opacity="0.04">
    <circle cx="40"  cy="40"  r="1"/><circle cx="120" cy="40"  r="1"/><circle cx="200" cy="40"  r="1"/><circle cx="280" cy="40"  r="1"/><circle cx="360" cy="40"  r="1"/><circle cx="440" cy="40"  r="1"/><circle cx="520" cy="40"  r="1"/><circle cx="600" cy="40"  r="1"/><circle cx="680" cy="40"  r="1"/><circle cx="760" cy="40"  r="1"/><circle cx="840" cy="40"  r="1"/><circle cx="920" cy="40"  r="1"/><circle cx="1000" cy="40" r="1"/><circle cx="1080" cy="40" r="1"/><circle cx="1160" cy="40" r="1"/><circle cx="1240" cy="40" r="1"/>
    <circle cx="40"  cy="120" r="1"/><circle cx="120" cy="120" r="1"/><circle cx="200" cy="120" r="1"/><circle cx="280" cy="120" r="1"/><circle cx="360" cy="120" r="1"/><circle cx="440" cy="120" r="1"/><circle cx="520" cy="120" r="1"/><circle cx="600" cy="120" r="1"/><circle cx="680" cy="120" r="1"/><circle cx="760" cy="120" r="1"/><circle cx="840" cy="120" r="1"/><circle cx="920" cy="120" r="1"/><circle cx="1000" cy="120" r="1"/><circle cx="1080" cy="120" r="1"/><circle cx="1160" cy="120" r="1"/><circle cx="1240" cy="120" r="1"/>
    <circle cx="40"  cy="200" r="1"/><circle cx="120" cy="200" r="1"/><circle cx="200" cy="200" r="1"/><circle cx="280" cy="200" r="1"/><circle cx="360" cy="200" r="1"/><circle cx="440" cy="200" r="1"/><circle cx="520" cy="200" r="1"/><circle cx="600" cy="200" r="1"/><circle cx="680" cy="200" r="1"/><circle cx="760" cy="200" r="1"/><circle cx="840" cy="200" r="1"/><circle cx="920" cy="200" r="1"/><circle cx="1000" cy="200" r="1"/><circle cx="1080" cy="200" r="1"/><circle cx="1160" cy="200" r="1"/><circle cx="1240" cy="200" r="1"/>
  </g>

  <!-- =============== LEFT: mRNA / DNA helix =============== -->
  <g transform="translate(60, 70)">
    <text x="0" y="-30" fill="#FFD43B" font-size="11" letter-spacing="3" font-weight="600">mRNA · sequence</text>
    <text x="0" y="-12" fill="#FFFFFF" fill-opacity="0.55" font-size="10" letter-spacing="2">codon → variant → neoantigen</text>

    <!-- two intertwined sinusoidal strands -->
    <g filter="url(#glow)">
      <path d="M 0 60 C 40 20, 80 100, 120 60 C 160 20, 200 100, 240 60 C 280 20, 320 100, 360 60"
            fill="none" stroke="url(#helixA)" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 0 60 C 40 100, 80 20, 120 60 C 160 100, 200 20, 240 60 C 280 100, 320 20, 360 60"
            fill="none" stroke="url(#helixB)" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.85"/>
    </g>

    <!-- base pair rungs -->
    <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.2">
      <line x1="20"  y1="40" x2="20"  y2="80"/>
      <line x1="60"  y1="60" x2="60"  y2="60"/>
      <line x1="100" y1="40" x2="100" y2="80"/>
      <line x1="140" y1="60" x2="140" y2="60"/>
      <line x1="180" y1="40" x2="180" y2="80"/>
      <line x1="220" y1="60" x2="220" y2="60"/>
      <line x1="260" y1="40" x2="260" y2="80"/>
      <line x1="300" y1="60" x2="300" y2="60"/>
      <line x1="340" y1="40" x2="340" y2="80"/>
    </g>

    <!-- colored base dots (A C G U) -->
    <g font-size="9" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">
      <circle cx="20"  cy="40" r="6" fill="#FF6B6B"/><text x="20"  y="43.5" fill="#1B1226">A</text>
      <circle cx="60"  cy="60" r="6" fill="#FFA94D"/><text x="60"  y="63.5" fill="#1B1226">C</text>
      <circle cx="100" cy="40" r="6" fill="#FFD43B"/><text x="100" y="43.5" fill="#1B1226">G</text>
      <circle cx="140" cy="60" r="6" fill="#4DD9CC"/><text x="140" y="63.5" fill="#1B1226">U</text>
      <circle cx="180" cy="40" r="6" fill="#FF6B6B"/><text x="180" y="43.5" fill="#1B1226">A</text>
      <circle cx="220" cy="60" r="6" fill="#FFA94D"/><text x="220" y="63.5" fill="#1B1226">C</text>
      <circle cx="260" cy="40" r="6" fill="#FFD43B"/><text x="260" y="43.5" fill="#1B1226">G</text>
      <circle cx="300" cy="60" r="6" fill="#4DD9CC"/><text x="300" y="63.5" fill="#1B1226">U</text>
      <circle cx="340" cy="40" r="6" fill="#FF6B6B"/><text x="340" y="43.5" fill="#1B1226">A</text>
    </g>

    <!-- side labels: CDS / 5'UTR / 3'UTR -->
    <g font-size="9" fill="#FFFFFF" fill-opacity="0.45" font-family="'JetBrains Mono', monospace">
      <text x="-15" y="63" text-anchor="end">5′</text>
      <text x="375" y="63">3′</text>
    </g>
  </g>

  <!-- =============== MIDDLE: Lean 4 proof symbol =============== -->
  <g transform="translate(490, 70)">
    <text x="0" y="-30" fill="#FFD43B" font-size="11" letter-spacing="3" font-weight="600">Lean 4 · Mathlib4</text>
    <text x="0" y="-12" fill="#FFFFFF" fill-opacity="0.55" font-size="10" letter-spacing="2">proof by construction</text>

    <!-- theorem box -->
    <g transform="translate(0, 10)">
      <rect x="0" y="0" width="300" height="100" rx="8" fill="#000000" fill-opacity="0.25" stroke="url(#proofGrad)" stroke-width="1.2"/>
      <!-- the actual turnstile + statement -->
      <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13">
        <text x="14" y="30" fill="#FFD43B">theorem</text>
        <text x="80" y="30" fill="#FFFFFF">ns_smooth :</text>
        <text x="14" y="52" fill="#FFFFFF" font-size="12">  &#x2200; u : NSField R3,</text>
        <text x="14" y="70" fill="#FFFFFF" font-size="12">    &#x2016;u&#x2016;&#x221e; &lt; &#x22A5; &#x2192; Regular u</text>
        <text x="14" y="90" fill="#4DD9CC">  by exact ladyzhenskaya_bridge</text>
      </g>
    </g>

    <!-- proof QED check -->
    <g transform="translate(310, 18)" filter="url(#glow)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#FFD43B" stroke-width="2.5"/>
      <path d="M -10 0 L -3 8 L 12 -7" fill="none" stroke="#FFD43B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="310" y="58" text-anchor="middle" fill="#FFD43B" font-size="9" font-weight="700" letter-spacing="2">QED</text>
    <text x="310" y="72" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.45" font-size="8" letter-spacing="1">100+ theorems</text>
  </g>

  <!-- =============== RIGHT: cfDNA fragment distribution =============== -->
  <g transform="translate(880, 70)">
    <text x="0" y="-30" fill="#FFD43B" font-size="11" letter-spacing="3" font-weight="600">cfDNA · fragmentomics</text>
    <text x="0" y="-12" fill="#FFFFFF" fill-opacity="0.55" font-size="10" letter-spacing="2">FSD · 4-mer · methylation</text>

    <!-- axes -->
    <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1">
      <line x1="0" y1="100" x2="340" y2="100"/>
      <line x1="0" y1="0"   x2="0"   y2="100"/>
    </g>

    <!-- healthy reference curve (dashed teal) -->
    <path d="M 0 90 Q 30 80 60 60 Q 100 30 145 18 Q 190 30 230 60 Q 285 82 320 88"
          fill="none" stroke="#4DD9CC" stroke-width="1.8" stroke-dasharray="4 3" stroke-opacity="0.55"/>
    <!-- cancer-shifted curve (solid coral, taller peak right-shifted) -->
    <path d="M 0 92 Q 30 86 60 78 Q 100 60 150 38 Q 200 24 245 30 Q 285 50 320 75"
          fill="none" stroke="url(#curveGrad)" stroke-width="3" filter="url(#glow)"/>
    <!-- filled area under cancer curve -->
    <path d="M 0 92 Q 30 86 60 78 Q 100 60 150 38 Q 200 24 245 30 Q 285 50 320 75 L 320 100 L 0 100 Z"
          fill="url(#curveGrad)" fill-opacity="0.18"/>

    <!-- peak marker -->
    <circle cx="200" cy="24" r="5" fill="#FF6B6B" filter="url(#glow)"/>
    <text x="200" y="14" text-anchor="middle" fill="#FF6B6B" font-size="10" font-weight="700">Δ peak</text>

    <!-- axis labels -->
    <g font-size="9" fill="#FFFFFF" fill-opacity="0.55" font-family="'JetBrains Mono', monospace">
      <text x="0"   y="115">100 bp</text>
      <text x="170" y="115" text-anchor="middle">fragment length</text>
      <text x="335" y="115" text-anchor="end">500 bp</text>
    </g>

    <!-- legend -->
    <g font-size="9" font-family="'JetBrains Mono', monospace">
      <line x1="0" y1="-2" x2="14" y2="-2" stroke="#4DD9CC" stroke-width="1.8" stroke-dasharray="4 3"/>
      <text x="20" y="1" fill="#FFFFFF" fill-opacity="0.65">healthy</text>
      <line x1="80" y1="-2" x2="94" y2="-2" stroke="#FF6B6B" stroke-width="2.5"/>
      <text x="100" y="1" fill="#FFFFFF" fill-opacity="0.85">cancer</text>
    </g>
  </g>

  <!-- =============== connecting flow arrows =============== -->
  <g fill="none" stroke="#FFD43B" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="2 4">
    <path d="M 420 130 L 480 130"/>
    <path d="M 820 130 L 870 130"/>
  </g>
  <g fill="#FFD43B" fill-opacity="0.5">
    <polygon points="478,126 478,134 488,130"/>
    <polygon points="868,126 868,134 878,130"/>
  </g>

  <!-- =============== bottom caption =============== -->
  <g>
    <text x="640" y="282" text-anchor="middle" fill="#FFD43B" font-size="14" font-weight="600" letter-spacing="2">
      Formalizing biology, one proof at a time.
    </text>
    <text x="640" y="304" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.45" font-size="10" letter-spacing="3">
      RNA &#xb7; proof &#xb7; signal
    </text>
  </g>
</svg>